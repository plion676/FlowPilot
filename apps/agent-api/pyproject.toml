[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opspilot-agent-api"
version = "0.1.0"
description = "OpsPilot Agent API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "langchain>=1.0,<2.0",
  "langchain-openai>=0.3,<2.0",
  "openai>=2.0,<4.0",
  "mcp==1.30.0",
  "PyYAML>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "fastembed==0.9.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
